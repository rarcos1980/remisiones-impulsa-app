name: Build Android APK (Remisiones Impulsa)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet flet-cli reportlab

      - name: Build Android APK
        run: |
          flet build apk --no-compile-app --no-compile-packages --yes

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: remisiones-impulsa-apk
          path: build/apk/*.apk
